name: Builder

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-app:
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/build-app.yaml
    with:
      app: tkstar_gateway
      publish: ${{ github.event_name == 'push' }}
    secrets: inherit

  verify-public-image:
    needs: build-app
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Inspect image without registry credentials
        run: |
          docker buildx imagetools inspect ghcr.io/arrowsk/ha-tkstar-gateway:latest > /tmp/image.txt
          cat /tmp/image.txt
          grep -q 'linux/amd64' /tmp/image.txt
          grep -q 'linux/arm64' /tmp/image.txt
