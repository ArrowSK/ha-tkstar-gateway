name: TKSTAR Gateway
description: Lightweight multi-tracker TKSTAR/WINNES tracking server for Home Assistant
version: "0.1.0"
slug: tkstar_gateway
url: https://github.com/ArrowSK/ha-tkstar-gateway
image: ghcr.io/arrowsk/ha-tkstar-gateway
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stage: experimental
ingress: true
ingress_port: 8099
panel_icon: mdi:map-marker-radius
panel_title: TKSTAR Gateway
panel_admin: true
watchdog: tcp://[HOST]:[PORT:8099]
services:
  - mqtt:need
ports:
  5093/tcp: 5093
  5013/tcp: 5013
  5023/tcp: 5023
ports_description:
  5093/tcp: Watch protocol (TK915/TK935 family)
  5013/tcp: H02 protocol
  5023/tcp: GT06 protocol
options:
  history_days: 180
  offline_after_minutes: 10
  google_geolocation_api_key: ""
  log_level: info
schema:
  history_days: int(1,730)
  offline_after_minutes: int(1,1440)
  google_geolocation_api_key: password
  log_level: list(debug|info|warn|error)
